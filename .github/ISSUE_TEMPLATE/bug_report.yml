name: Bug report
description: Help reproduce and fix a problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the steps and command used.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.12.7"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Bug report
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: The example contains no restricted archival records or personal data.
          required: true
