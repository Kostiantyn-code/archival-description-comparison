schema_version: "1.0"
input_dir: input
output_dir: output

chronology:
  minimum_year: 1700
  maximum_year: 2026
  expansion_mode: span
  maximum_span_years: 100

vocabulary:
  minimum_document_frequency: 3
  terms_per_dataset: 40
  common_terms: 50

similarity:
  enabled: true
  minimum_score: 0.28
  matches_per_case: 3
  max_features: 40000
  character_ngram_min: 3
  character_ngram_max: 5

reports:
  csv: true
  xlsx: true
  html: true
  charts: true
